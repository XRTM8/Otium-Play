name: Build & Release Otium Play APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Synchronize Web Assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r public/* android/app/src/main/assets/public/

      - name: Restore stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KRMZI_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing stable signing key"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/krmzi-release.keystore"
          chmod 600 "$RUNNER_TEMP/krmzi-release.keystore"

      - name: Build signed release
        env:
          KRMZI_KEYSTORE_PATH: ${{ runner.temp }}/krmzi-release.keystore
          KRMZI_STORE_PASSWORD: ${{ secrets.KRMZI_STORE_PASSWORD }}
          KRMZI_KEY_ALIAS: ${{ secrets.KRMZI_KEY_ALIAS }}
          KRMZI_KEY_PASSWORD: ${{ secrets.KRMZI_KEY_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Verify signature and stage exact release APK
        run: |
          set -euo pipefail
          EXPECTED_FINGERPRINT=$(tr -d '\r\n' < .github/signing-certificate.sha256)
          test -n "$EXPECTED_FINGERPRINT"
          APK_FILE=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK_FILE" > "$RUNNER_TEMP/krmzi-cert.txt"
          ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/krmzi-cert.txt")
          test "$ACTUAL" = "$EXPECTED_FINGERPRINT" || { echo "Signing key mismatch"; exit 1; }
          mkdir -p release-output
          cp "$APK_FILE" release-output/krmzi-pro.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Otium Play - ${{ github.event.inputs.version || github.ref_name }}
          body: |
            # 📱 Otium Play (APK)
            
            الإصدار الرسمي لتطبيق مشاهدة وبث المسلسلات التركية بدون أي إعلانات نهائياً وبجودة تصل إلى 1080p Full HD.
            
            ---
            
            ### ✨ مميزات التطبيق في هذا الإصدار:
            - **صفر إعلانات (100% Ad-Free):** حظر كامل لكافة النوافذ المنبثقة والإعلانات الإجبارية وإعلانات السيرفرات.
            - **جودة Full HD (1080p):** استخراج دفقات الفيديو الأصلية المباشرة وتشغيلها في مشغل أصلي فائق السلاسة.
            - **إيماءات تحكم ذكية للهاتف:**
              - السحب الرأسي على يسار الشاشة للتحكم بالسطوع.
              - السحب الرأسي على يمين الشاشة للتحكم بمستوى الصوت.
              - الضغط المطول المستمر على الشاشة لمضاعفة السرعة فوراً إلى **`2X`**.
              - النقر المزدوج على أطراف الشاشة للتقديم والتأخير (+10s / -10s).
              - زر تخطي شارة البداية بنقرة واحدة (+85 ثانية).
              - الانتقال التلقائي للحلقة التالية مع عداد تنازلي ذكي.
            - **واجهة مينيمال سينمائية (OLED Dark):** مصممة خصيصاً لتجربة هاتف فاخرة بفيزياء 60FPS.
            - **سجل المشاهدة والمفضلة:** استئناف تشغيل الحلقات تلقائياً من حيث توقفت.
            
            ---
            
            ### 📥 طريقة التثبيت على الهاتف:
            1. قم بتحميل ملف **`krmzi-pro.apk`** أدناه.
            2. افتح الملف على هاتفك الأندرويد واضغط **تثبيت (Install)**.
            3. استمتع بمشاهدة جميع المسلسلات التركية المفضلة بأعلى جودة وبدون أي إعلان.
          files: release-output/krmzi-pro.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
